<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thirr Mjeshtrin – gjej mjeshtër në Kosovë</title>
<meta name="description" content="Gjej hidraulik, elektriçar, murator dhe mjeshtra të tjerë në qytetin tënd dhe telefono drejtpërdrejt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#12213B;--mut:#55627A;--line:#DDE3EC;--hero:#12213B;--acc:#C2410C;--accink:#fff;--wa:#168A4A;--font:'Archivo','Segoe UI',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0D1524;--card:#16213A;--ink:#EEF2F9;--mut:#A3AEC4;--line:#2A3752;--hero:#16213A;--acc:#FF7A33;--accink:#1A0B02;--wa:#3DCB7A}}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 var(--font);background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--hero);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(18px,calc((100% - 1040px)/2 + 18px))}
.logo{font-weight:800;font-stretch:90%;font-size:19px;letter-spacing:-.01em;color:#fff;text-decoration:none}
.logo b{color:#FF7A33}
nav{display:flex;gap:10px;font-size:15px;font-weight:600}
nav a{color:#fff;text-decoration:none;padding:8px 14px;border:1.5px solid rgba(255,255,255,.55);border-radius:8px}
nav a:hover{border-color:#fff}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.narrow{max-width:560px;padding-top:26px;padding-bottom:60px}
.hero{background:var(--hero);color:#fff;padding:20px 0 30px}
h1{font-weight:800;font-stretch:90%;font-size:clamp(2.2rem,8vw,3.8rem);line-height:1.02;letter-spacing:-.01em;word-spacing:.1em;margin:0 0 12px;max-width:15ch}{font-weight:800;font-stretch:80%;font-size:clamp(2.2rem,8vw,3.8rem);line-height:1;letter-spacing:-.02em;margin:0 0 12px;max-width:15ch}
.narrow h1{font-size:clamp(1.9rem,6vw,2.4rem);max-width:none}
.hero p{margin:0 0 20px;max-width:46ch;opacity:.88;font-size:1.05rem}
.mut{color:var(--mut)}
.filters{display:grid;gap:10px;background:var(--card);padding:12px;border-radius:14px;grid-template-columns:1fr}
@media(min-width:620px){.filters{grid-template-columns:1fr 1fr}}
.filters label span{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:2px 4px 4px}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:0 12px;height:50px;margin-bottom:10px}
textarea{height:auto;padding:12px}
.filters select{margin:0}
.count{margin:22px 0 0;color:var(--mut);font-size:.95rem}
.list{display:grid;gap:12px;margin:12px 0 60px}
@media(min-width:720px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.card h3{margin:0;font-size:1.15rem;font-weight:700}
.tag{display:inline-block;font-size:.8rem;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-right:6px;color:var(--ink)}
.card p{margin:0;color:var(--mut)}
.acts{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;font:inherit;font-weight:700;background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:0 20px;text-decoration:none;cursor:pointer}
.btn.wa{background:transparent;color:var(--wa);border:1.5px solid var(--wa)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.state{grid-column:1/-1;padding:28px 18px;text-align:center;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;color:var(--mut)}
.state strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header><a class="logo" href="#">Thirr<b>Mjeshtrin</b></a><nav id="nav"></nav></header>
<main id="app"><div class="wrap narrow">Duke ngarkuar…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
